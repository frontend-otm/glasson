<head>
    <meta charset="UTF-8">

    <title>Glasson</title>

<body>

    <script>
        const params = new URLSearchParams(window.location.search);
        const inputVariant = {
            skuId: '11485',
        };
        const demo = true;

        const mode = 'try_on';
        const showSwitchMode = false;
        const forceRefresh = false;
        const hide = false;
        const newCore = true;

        // Virtual Fitting
        const glassonComponent = document.querySelector('glasson-configurator');
        glassonComponent.setAttribute('inputVariant', JSON.stringify(inputVariant));
        glassonComponent.setAttribute('demo', demo);
        glassonComponent.setAttribute('mode', mode);
        glassonComponent.setAttribute('hide', hide);
        glassonComponent.setAttribute('newCore', newCore);
        glassonComponent.setAttribute('showSwitchMode', showSwitchMode);
        glassonComponent.setAttribute('forceRefresh', forceRefresh);

        let hasRequestedCamera = false

        async function handleCamera() {
            hasRequestedCamera = true

            try {
                await navigator.mediaDevices.getUserMedia({ video: true })
                console.log('Camera access granted');
            } catch (err) {
                console.log('Camera access denied');
                if (err.name === 'NotAllowedError') {
                    if (hasRequestedCamera) {
                        // 👉 น่าจะเป็น user กด deny ครั้งนี้
                        console.log('User denied camera access');
                    }
                }
            }
        }
