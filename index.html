    <script>
        async function requestCameraPermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());
                return { granted: true };
            } catch (error) {
                if (error.name === 'NotAllowedError') {
                    return { granted: false, reason: 'denied' };
                }
                if (error.name === 'NotFoundError') {
                    return { granted: false, reason: 'no_device' };
                }
                return { granted: false, reason: 'error', error };
            }
        }

        const params = new URLSearchParams(window.location.search);
        const inputVariant = {
            skuId: '11485',
        };
        const demo = true;

        const mode = 'try_on';
        const showSwitchMode = false;
        const forceRefresh = false;
        const hide = false;
        const newCore = true;

        // Virtual Fitting
        const glassonComponent = document.querySelector('glasson-configurator');
        glassonComponent.setAttribute('inputVariant', JSON.stringify(inputVariant));
        glassonComponent.setAttribute('demo', demo);
        glassonComponent.setAttribute('mode', mode);
        glassonComponent.setAttribute('hide', hide);
        glassonComponent.setAttribute('newCore', newCore);
        glassonComponent.setAttribute('showSwitchMode', showSwitchMode);
        glassonComponent.setAttribute('forceRefresh', forceRefresh);
